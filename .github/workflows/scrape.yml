name: Scrape Yamaha Listings

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC = 9:00 CEST
    - cron: '0 17 * * *'  # 17:00 UTC = 19:00 CEST
  workflow_dispatch:       # manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run scraper & sync to Cloudflare D1
        run: node scraper.js
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'false'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WORKER_URL: 'https://yamaha-listings.maxgustaw.workers.dev'
          ADMIN_SYNC_SECRET: ${{ secrets.ADMIN_SYNC_SECRET || 'yamaha-listing-tracker-secret-2026' }}
