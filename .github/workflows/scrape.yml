name: Scrape Yamaha Listings

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC = 9:00 CEST
    - cron: '0 17 * * *'  # 17:00 UTC = 19:00 CEST
  workflow_dispatch:       # manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run scraper
        run: node scraper.js
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'false'

      - name: Commit updated listings
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/listings.json listings.json
          git diff --staged --quiet || git commit -m "chore: update yamaha listings [skip ci]"
          git push
