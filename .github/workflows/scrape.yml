name: Scrape Yamaha Listings

on:
  schedule:
    - cron: '40 9 * * *'  # 09:40 UTC = 11:40 CEST (Test)
    - cron: '0 7 * * *'   # 07:00 UTC = 9:00 CEST
    - cron: '0 17 * * *'  # 17:00 UTC = 19:00 CEST
  workflow_dispatch:       # manual trigger from GitHub UI

# Grant the GITHUB_TOKEN write access so git push works
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 (Fix Segfault)
        run: npm rebuild better-sqlite3 --build-from-source

      - name: Install Chromium for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run scraper
        run: node scraper.js
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'false'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit updated listings
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add listings.db public/listings.json
          git diff --staged --quiet || git commit -m "chore: update yamaha listings"
          git pull --rebase || echo "No changes to pull or rebase failed"
          git push

      - name: Trigger Cloudflare Pages Deployment
        if: success()
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}" ]; then
            echo "Triggering Cloudflare deployment..."
            curl -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"
          else
            echo "CLOUDFLARE_DEPLOY_HOOK secret is not set. Skipping deployment."
          fi
